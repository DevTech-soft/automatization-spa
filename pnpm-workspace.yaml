packages:
  - "apps/*"
  - "packages/*"

# Scripts de instalación (postinstall) permitidos: prisma/esbuild/puppeteer los
# necesitan. pnpm los bloquea por defecto como medida de supply-chain.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  puppeteer: true
