# Desarrollo local: la API se conecta a un proyecto Supabase (dev/staging),
# no a un Postgres local, para no mantener dos configuraciones de base de
# datos distintas (ver docs/ARCHITECTURE.md).
services:
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: build
    command: pnpm --filter @spa/backend dev
    ports:
      - "3000:3000"
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./apps/backend/web:/app/apps/backend/web
      - ./packages/db/prisma:/app/packages/db/prisma
