<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmación de tu reserva</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="confirm-shell">
      <div class="confirm-card" id="confirmCard">
        <svg class="confirm-icon" id="confirmIcon" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" />
          <path d="M20 33 L28 41 L45 24" />
        </svg>
        <p class="confirm-status" id="confirmStatus">Confirmando</p>
        <h1 id="confirmTitle">Un momento…</h1>
        <div id="confirmBody">
          <p>Estamos verificando el estado de tu reserva.</p>
        </div>
      </div>
    </div>

    <script type="module" src="/js/gracias.js"></script>
  </body>
</html>
